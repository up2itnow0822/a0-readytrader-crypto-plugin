<html>
<head>
    <title>ReadyTrader Crypto (paper)</title>
</head>

<body>
    <div x-data>
        <template x-if="config">
            <div>
                <div class="section-title">ReadyTrader Crypto (paper)</div>
                <div class="section-description">
                    The plugin installs the ReadyTrader-Crypto MCP server into its own folder and registers it under
                    MCP/A2A &rarr; External MCP Servers as <code>readytrader_crypto</code>. The server always runs the
                    paper profile: paper mode, trading halted, live execution disabled, no exchange keys. Saving applies
                    the settings at once: the server is moved to the chosen version, checked, and registered again (a
                    version change can take a few minutes). If that fails, nothing is saved and the current setup stays
                    as it was. Saving again without changes repairs the setup.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Server repository</div>
                        <div class="field-description">
                            An https Git URL, or the absolute path of a ReadyTrader-Crypto clone you manage.
                            Install runs this repository's code; use ReadyTrader-Crypto or a fork you trust.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                            x-init="if (!config.server_repo) config.server_repo = 'https://github.com/up2itnow0822/ReadyTrader-Crypto.git'"
                            x-model="config.server_repo" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Server version</div>
                        <div class="field-description">
                            Branch, tag or full commit SHA. The version must refuse exchange-account tools in paper
                            mode (ReadyTrader-Crypto PR #20 or later); the plugin checks this before registering it.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                            x-init="if (!config.server_ref) config.server_ref = 'main'"
                            x-model="config.server_ref" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Start-up timeout (seconds)</div>
                        <div class="field-description">
                            How long Agent Zero waits for the server to list its tools.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="5" max="3600" step="5"
                            x-init="if (config.init_timeout === undefined || config.init_timeout === null) config.init_timeout = 60"
                            x-model.number="config.init_timeout" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Tool call timeout (seconds)</div>
                        <div class="field-description">
                            How long Agent Zero waits for one tool call (the server starts afresh for each call).
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="5" max="3600" step="5"
                            x-init="if (config.tool_timeout === undefined || config.tool_timeout === null) config.tool_timeout = 120"
                            x-model.number="config.tool_timeout" />
                    </div>
                </div>
            </div>
        </template>
    </div>
</body>

</html>
