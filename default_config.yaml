# ReadyTrader Crypto (Agent Zero plugin) - defaults for the settings hooks.py applies on install, on every
# update, and whenever the plugin's settings screen is saved (saving applies them at once).

# Where the ReadyTrader-Crypto MCP server comes from: an https Git URL (or an absolute path to a clone
# you manage) and the branch, tag or full commit SHA to check out. The setup clones it into <plugin>/server and
# installs its requirements into <plugin>/server/.venv with Agent Zero's own Python (3.12+).
server_repo: "https://github.com/up2itnow0822/ReadyTrader-Crypto.git"
server_ref: "main"

# The MCP entry is always named readytrader_crypto (the agent sees readytrader_crypto.get_crypto_price and
# so on): the skill calls the tools by that name, so it is not a setting.

# Seconds Agent Zero waits for the server to list its tools, and for one tool call.
# Agent Zero starts the server afresh for each operation, so allow for its start-up time.
init_timeout: 60
tool_timeout: 120
